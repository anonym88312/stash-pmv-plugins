name: RedTok
description: RedGifs as a TikTok-style feed – swipe through videos, follow creators and niches, like, and save the ones you want into your Stash library with one tap. Also plays your own Stash scenes as a feed. No account needed.
version: 1.9.0
url: https://github.com/anonym88312/stash-pmv-plugins

# Backend: RedGifs for browsers that can't reach it themselves, downloads into your library, the backup file
exec:
  - python
  - "{pluginDir}/backend.py"
interface: raw

ui:
  javascript:
    - redtok.js # a "RedTok" button in classic Stash's navbar
  # Only web/ is served – never the backend or its .cache
  assets:
    /: web
